<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>用户池管理</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: linear-gradient(160deg, #fff5ee 0%, #ffeef3 45%, #f3e9ff 100%) fixed;
    padding: 24px;
    min-height: 100vh;
  }
  .container { max-width: 1600px; margin: 0 auto; }

  /* 落日主题头部 */
  .hero {
    position: relative;
    background: linear-gradient(120deg, #ff9a56 0%, #ff6f91 55%, #9d6bce 100%);
    border-radius: 18px;
    padding: 28px 32px;
    margin-bottom: 20px;
    color: #fff;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(255, 122, 122, .25);
  }
  .hero::after {
    content: "";
    position: absolute;
    width: 180px; height: 180px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,236,170,.9) 0%, rgba(255,236,170,0) 70%);
    top: -40px; right: 60px;
    pointer-events: none;
  }
  .hero h1 { font-size: 24px; letter-spacing: 1px; }
  .hero p { margin-top: 6px; font-size: 13px; opacity: .92; letter-spacing: 2px; }

  .toolbar {
    display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap;
  }
  .toolbar input, .toolbar select {
    padding: 9px 14px; border: 1px solid #ecd9d3; border-radius: 999px;
    font-size: 14px; outline: none; background: rgba(255,255,255,.9);
    transition: border-color .2s, box-shadow .2s;
  }
  .toolbar input { width: 240px; }
  .toolbar input:focus, .toolbar select:focus {
    border-color: #ff8a65;
    box-shadow: 0 0 0 3px rgba(255, 138, 101, .15);
  }

  table {
    width: 100%; border-collapse: collapse; background: rgba(255,255,255,.92);
    border-radius: 16px; overflow: hidden;
    box-shadow: 0 8px 28px rgba(180, 120, 110, .14);
    font-size: 14px;
    backdrop-filter: blur(4px);
  }
  thead th {
    background: linear-gradient(120deg, #4a3557, #6b4d7a);
    color: #ffe9dd; padding: 13px 10px;
    text-align: left; white-space: nowrap; font-weight: 600;
    letter-spacing: 1px;
  }
  tbody td {
    padding: 11px 10px; border-bottom: 1px solid #f7e8e4;
    color: #4a3f3a; white-space: nowrap;
  }
  tbody tr:hover { background: #fff7f2; }
  tbody tr.row-dead { background: #fdf1ee; }
  tbody tr.row-dead:hover { background: #f9e4e0; }
  tbody tr.row-suspected { background: #f9e2e6; }
  tbody tr.row-suspected:hover { background: #f5d3da; }

  .tag {
    display: inline-block; padding: 3px 12px; border-radius: 999px;
    font-size: 12px; font-weight: 600;
  }
  .tag.alive     { background: #e2f4e8; color: #3e8e5f; }
  .tag.dead      { background: #f6e3e0; color: #a85b52; }
  .tag.unknown   { background: #fbf0d3; color: #ad7f1f; }
  .tag.suspected { background: linear-gradient(120deg, #d1516a, #b23a55); color: #fff; }

  .missed { color: #8a7b74; font-size: 13px; }
  .missed .warn { color: #c74a5e; font-weight: 600; }
  .pending-hint { color: #e0704d; font-size: 12px; }

  .pwd { font-family: monospace; letter-spacing: 1px; cursor: pointer; }
  .pwd:hover { color: #e0704d; }

  .btn-sms {
    padding: 6px 16px; border: none; border-radius: 999px;
    background: linear-gradient(120deg, #ff8a5c, #ff6f91);
    color: #fff; font-size: 13px; cursor: pointer;
    transition: opacity .2s, transform .1s;
    box-shadow: 0 3px 10px rgba(255, 122, 122, .3);
  }
  .btn-sms:hover:not(:disabled) { opacity: .88; transform: translateY(-1px); }
  .btn-sms:disabled { background: #d8c9c3; box-shadow: none; cursor: not-allowed; }

  .btn-add {
    padding: 9px 18px; border: none; border-radius: 999px;
    background: linear-gradient(120deg, #7bc496, #5aa87a);
    color: #fff; font-size: 14px; cursor: pointer;
    box-shadow: 0 3px 10px rgba(122, 180, 140, .3);
  }
  .btn-add:hover { opacity: .88; }

  .btn-confirm {
    padding: 6px 16px; border: none; border-radius: 999px;
    background: linear-gradient(120deg, #c74a5e, #a83a50);
    color: #fff; font-size: 13px; cursor: pointer;
    margin-left: 6px;
  }
  .btn-confirm:hover { opacity: .88; }

  .btn-market {
    display: inline-block; margin-left: 6px; padding: 6px 12px;
    border: 1px solid #9d6bce; border-radius: 999px;
    color: #68417f; background: #fff; font-size: 13px;
    text-decoration: none; white-space: nowrap;
  }
  .btn-market:hover, .btn-market:focus-visible { background: #f4eafb; }
  .btn-market-admin { margin-left: 0; padding: 9px 16px; border-color: #68417f; font-size: 14px; font-weight: 600; }

  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .form-grid label { font-size: 13px; color: #5c4f49; display: block; margin-bottom: 4px; }
  .form-grid input, .form-grid select {
    width: 100%; padding: 8px 12px; border: 1px solid #ecd9d3;
    border-radius: 10px; font-size: 14px; outline: none;
  }
  .form-grid input:focus, .form-grid select:focus {
    border-color: #ff8a65;
    box-shadow: 0 0 0 3px rgba(255, 138, 101, .12);
  }
  .form-grid .span2 { grid-column: span 2; }

  .btn-save {
    padding: 9px 18px; border: none; border-radius: 999px;
    background: linear-gradient(120deg, #8a7598, #6b5578);
    color: #fff; font-size: 14px; cursor: pointer;
  }
  .btn-save:hover { opacity: .88; }

  .btn-auto {
    padding: 9px 18px; border: none; border-radius: 999px;
    background: #cfc2ca; color: #fff; font-size: 14px; cursor: pointer;
    transition: background .2s;
  }
  .btn-auto.on {
    background: linear-gradient(120deg, #ff8a5c, #ff6f91);
    box-shadow: 0 3px 10px rgba(255, 122, 122, .3);
  }
  .auto-hint { font-size: 12px; color: #a08b83; align-self: center; }

  .modal-mask {
    position: fixed; inset: 0; background: rgba(74, 53, 87, .35);
    display: none; align-items: center; justify-content: center; z-index: 100;
    backdrop-filter: blur(3px);
  }
  .modal-mask.show { display: flex; }
  .modal {
    background: #fffdfb; border-radius: 18px; padding: 26px;
    width: 420px; max-width: 92vw;
    box-shadow: 0 20px 50px rgba(120, 80, 100, .25);
  }
  .modal h3 { margin-bottom: 12px; color: #4a3b45; font-size: 17px; }
  .modal p  { font-size: 14px; color: #9a8578; margin-bottom: 10px; }
  .modal textarea {
    width: 100%; height: 110px; padding: 10px; font-size: 14px;
    border: 1px solid #ecd9d3; border-radius: 10px; resize: vertical;
    font-family: inherit; outline: none;
  }
  .modal textarea:focus { border-color: #ff8a65; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }
  .btn-cancel {
    padding: 8px 18px; border: 1px solid #e3d2cc; border-radius: 999px;
    background: #fff; cursor: pointer; font-size: 14px; color: #7a6a62;
  }
  .btn-send {
    padding: 8px 18px; border: none; border-radius: 999px;
    background: linear-gradient(120deg, #ff8a5c, #ff6f91);
    color: #fff; cursor: pointer; font-size: 14px;
  }
  .btn-send:hover { opacity: .88; }

  .toast {
    position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
    padding: 10px 24px; border-radius: 999px; color: #fff; font-size: 14px;
    background: linear-gradient(120deg, #6fb98a, #57a274); display: none; z-index: 200;
    box-shadow: 0 6px 16px rgba(110, 160, 130, .35);
  }
  .toast.error { background: linear-gradient(120deg, #d1516a, #b23a55); }

  .empty { text-align: center; color: #b8a39b; padding: 40px 0; }

  /* ===== 动效：背景柔光 ===== */
  body::before, body::after {
    content: "";
    position: fixed; border-radius: 50%; pointer-events: none; z-index: -1;
    filter: blur(70px); opacity: .5;
  }
  body::before {
    width: 420px; height: 420px;
    background: radial-gradient(circle, #ffd9b0, transparent 70%);
    top: -80px; left: -60px;
    animation: blobFloat1 16s ease-in-out infinite alternate;
  }
  body::after {
    width: 460px; height: 460px;
    background: radial-gradient(circle, #dcc2f5, transparent 70%);
    bottom: -120px; right: -80px;
    animation: blobFloat2 20s ease-in-out infinite alternate;
  }
  @keyframes blobFloat1 { from { transform: translate(0, 0); } to { transform: translate(60px, 40px); } }
  @keyframes blobFloat2 { from { transform: translate(0, 0); } to { transform: translate(-50px, -50px); } }

  /* ===== 动效：入场 ===== */
  .hero, .toolbar, table { animation: fadeUp .6s ease both; }
  .toolbar { animation-delay: .1s; }
  table { animation-delay: .2s; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ===== 动效：弹窗弹出 ===== */
  .modal-mask.show .modal { animation: pop .28s cubic-bezier(.2, .9, .3, 1.15); }
  @keyframes pop {
    from { opacity: 0; transform: translateY(16px) scale(.96); }
  }

  /* ===== 动效：疑似已故呼吸提醒 ===== */
  .tag.suspected { animation: glowPulse 2.2s ease-in-out infinite; }
  @keyframes glowPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(210, 81, 106, .4); }
    50%      { box-shadow: 0 0 0 7px rgba(210, 81, 106, 0); }
  }

  /* ===== 动效：按钮按感 ===== */
  button { transition: opacity .2s, transform .12s, box-shadow .2s; }
  button:active:not(:disabled) { transform: scale(.96); }

  /* ===== 元素：星光（封面夜空） ===== */
  .star {
    position: absolute; width: 4px; height: 4px; border-radius: 50%;
    background: #fff; pointer-events: none;
    animation: twinkle 2.6s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: .15; transform: scale(.7); }
    50%      { opacity: .95; transform: scale(1.1); }
  }

  /* ===== 元素：蝴蝶（封面花田） ===== */
  .butterfly {
    position: absolute; width: 8px; height: 14px; pointer-events: none; z-index: 1;
    background: linear-gradient(rgba(90,60,90,.85), rgba(90,60,90,.85)) center / 2px 100% no-repeat;
  }
  .butterfly::before, .butterfly::after {
    content: ""; position: absolute; top: 0; width: 11px; height: 15px;
    border-radius: 60% 60% 55% 55%;
  }
  .butterfly::before {
    right: 6px; transform-origin: right center;
    animation: flap .42s ease-in-out infinite alternate;
  }
  .butterfly::after {
    left: 6px; transform-origin: left center;
    animation: flap .42s ease-in-out infinite alternate;
  }
  @keyframes flap { from { transform: scaleX(1); } to { transform: scaleX(.35); } }
  .bf-warm::before, .bf-warm::after { background: linear-gradient(135deg, #ffe0b0, #ff9a8a); }
  .bf-pink::before, .bf-pink::after { background: linear-gradient(135deg, #ffc9d6, #ff8fb0); }
  .bf-purple::before, .bf-purple::after { background: linear-gradient(135deg, #e6d0ff, #c39ae0); }
  .bf1 { animation: drift1 13s ease-in-out infinite alternate; }
  .bf2 { animation: drift2 17s ease-in-out infinite alternate; }
  .bf3 { animation: drift3 15s ease-in-out infinite alternate; }
  @keyframes drift1 { from { left: 6%;  top: 60%; transform: rotate(10deg); } to { left: 72%; top: 16%; transform: rotate(-8deg); } }
  @keyframes drift2 { from { left: 80%; top: 64%; transform: rotate(-6deg); } to { left: 30%; top: 20%; transform: rotate(10deg); } }
  @keyframes drift3 { from { left: 45%; top: 74%; transform: rotate(4deg);  } to { left: 90%; top: 42%; transform: rotate(-10deg); } }
</style>
</head>
<body>
<div class="container">
  <div class="hero">
    <span class="star" style="top:18%; left:14%"></span>
    <span class="star" style="top:32%; left:38%; animation-delay:.6s"></span>
    <span class="star" style="top:12%; left:55%; animation-delay:1.2s"></span>
    <span class="star" style="top:44%; left:68%; animation-delay:.9s"></span>
    <span class="star" style="top:24%; left:82%; animation-delay:1.8s"></span>
    <span class="star" style="top:56%; left:24%; animation-delay:1.4s"></span>
    <span class="butterfly bf-warm bf1"></span>
    <span class="butterfly bf-pink bf2"></span>
    <span class="butterfly bf-purple bf3"></span>
    <h1>用户池管理</h1>
    <p>每一份数字遗产，都值得被温柔以待</p>
  </div>

  <div class="toolbar">
    <input type="text" id="searchInput" placeholder="搜索姓名 / 身份证号 / 电话号…">
    <select id="statusFilter">
      <option value="">全部生存状态</option>
      <option value="疑似已故">疑似已故</option>
      <option value="已故">已故</option>
      <option value="未知">未知</option>
      <option value="健在">健在</option>
    </select>
    <a class="btn-market btn-market-admin" href="/market-admin">行情管理后台</a>
    <button class="btn-add" onclick="openAddModal()">＋ 添加用户</button>
    <button class="btn-save" onclick="saveData()">保存</button>
    <button class="btn-auto" id="autoBtn" onclick="toggleAuto()">自动发送：…</button>
    <span class="auto-hint" id="autoHint"></span>
  </div>

  <table>
    <thead>
      <tr>
        <th>姓名</th>
        <th>性别</th>
        <th>年龄</th>
        <th>身份证号</th>
        <th>游戏（资产）种类</th>
        <th>游戏账号</th>
        <th>密码</th>
        <th>电话号</th>
        <th>生存状态</th>
        <th>未回应</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody id="userTableBody"></tbody>
  </table>
</div>

<div class="modal-mask" id="smsModal">
  <div class="modal">
    <h3>发送确认短信</h3>
    <p id="smsTarget"></p>
    <textarea id="smsContent"></textarea>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">取消</button>
      <button class="btn-send" onclick="confirmSend()">确认发送</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- 添加用户弹窗 -->
<div class="modal-mask" id="addModal">
  <div class="modal" style="width: 520px;">
    <h3>添加用户</h3>
    <div class="form-grid">
      <div><label>姓名</label><input id="f_name" placeholder="张三"></div>
      <div><label>性别</label>
        <select id="f_gender"><option value="男">男</option><option value="女">女</option></select>
      </div>
      <div><label>年龄</label><input id="f_age" type="number" min="1" max="150" placeholder="30"></div>
      <div><label>电话号</label><input id="f_phone" maxlength="11" placeholder="11位手机号"></div>
      <div class="span2"><label>身份证号</label><input id="f_idCard" maxlength="18" placeholder="18位身份证号"></div>
      <div><label>游戏（资产）种类</label><input id="f_game" placeholder="如：王者荣耀"></div>
      <div><label>游戏账号</label><input id="f_account" placeholder="游戏账号"></div>
      <div class="span2"><label>密码</label><input id="f_password" placeholder="游戏账号密码"></div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeAddModal()">取消</button>
      <button class="btn-send" style="background:linear-gradient(120deg,#7bc496,#5aa87a)" onclick="submitAddUser()">添加</button>
    </div>
  </div>
</div>

<script>
let users = [];
let autoEnabled = false;
const tbody = document.getElementById("userTableBody");
const searchInput = document.getElementById("searchInput");
const statusFilter = document.getElementById("statusFilter");

const DEFAULT_SMS = "【用户池平台】尊敬的用户：我们正在进行例行的账户信息核对，请您在方便时打开本消息回复确认。如给您带来不便，敬请谅解。";

/* 疑似已故 > 已故 > 未知 > 健在 */
const priority = { "疑似已故": 0, "已故": 1, "未知": 2, "健在": 3 };

function togglePwd(el) {
  const real = el.dataset.real;
  el.textContent = el.textContent === "••••••" ? real : "••••••";
}

function statusTag(status) {
  const cls = { "健在": "alive", "已故": "dead", "未知": "unknown", "疑似已故": "suspected" }[status] || "unknown";
  return `<span class="tag ${cls}">${status}</span>`;
}

function missedCell(u) {
  const cls = u.missedCount > 0 ? "warn" : "";
  let html = `<span class="missed"><span class="${cls}">${u.missedCount}/3</span></span>`;
  if (u.pending) {
    const deadline = Date.now() + u.pending.remainMs;
    html += `<div class="pending-hint">等待回复 <span class="cd" data-deadline="${deadline}">${Math.ceil(u.pending.remainMs / 1000)}</span>s</div>`;
  }
  return html;
}

function render() {
  const kw = searchInput.value.trim().toLowerCase();
  const st = statusFilter.value;
  const list = users.filter(u =>
    (st === "" || u.status === st) &&
    (kw === "" || u.name.toLowerCase().includes(kw) ||
      u.idCard.includes(kw) || u.phone.includes(kw))
  );
  list.sort((a, b) => (priority[a.status] ?? 9) - (priority[b.status] ?? 9));

  if (list.length === 0) {
    tbody.innerHTML = `<tr><td colspan="11" class="empty">暂无匹配的用户数据</td></tr>`;
    return;
  }

  tbody.innerHTML = list.map(u => {
    const rowCls = u.status === "疑似已故" ? "row-suspected" : u.status === "已故" ? "row-dead" : "";
    let btn = u.pending
      ? `<button class="btn-sms" disabled>等待回复…</button>`
      : `<button class="btn-sms" onclick="openModal(${u.id}, '${u.phone}', '${u.name}')">发送短信</button>`;
    if (u.status === "疑似已故") {
      btn += `<button class="btn-confirm" onclick="confirmDead(${u.id}, '${u.name}')">确认已故</button>`;
    }
    btn += '<a class="btn-market" href="/market-admin?userId=' + u.id + '">管理行情</a>';
    if (u.status === "已故") {
      btn += '<a class="btn-market" href="/mobile?userId=' + u.id + '&tab=sell" target="_blank" rel="noopener">继承人预览</a>';
    }
    return `
    <tr class="${rowCls}">
      <td>${u.name}</td>
      <td>${u.gender}</td>
      <td>${u.age}</td>
      <td>${u.idCard}</td>
      <td>${u.game}</td>
      <td>${u.account}</td>
      <td><span class="pwd" data-real="${u.password}" onclick="togglePwd(this)" title="点击显示/隐藏">••••••</span></td>
      <td>${u.phone}</td>
      <td>${statusTag(u.status)}</td>
      <td>${missedCell(u)}</td>
      <td>${btn}</td>
    </tr>`;
  }).join("");
}

async function loadUsers() {
  try {
    const resp = await fetch("/api/users");
    const data = await resp.json();
    users = data.users;
    updateAutoUI(data.autoSend);
    render();
  } catch (e) {
    console.error("加载用户失败", e);
  }
}

function updateAutoUI(autoSend) {
  autoEnabled = autoSend.enabled;
  const btn = document.getElementById("autoBtn");
  btn.textContent = autoEnabled ? "自动发送：开" : "自动发送：关";
  btn.classList.toggle("on", autoEnabled);
  document.getElementById("autoHint").innerHTML = autoEnabled
    ? `每 ${autoSend.intervalSec}s 询问 ${autoSend.batch} 位，下次 <span class="cd" data-deadline="${Date.now() + autoSend.remainMs}">${Math.ceil(autoSend.remainMs / 1000)}</span>s`
    : "";
}

async function toggleAuto() {
  const resp = await fetch("/api/auto-send", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ enabled: !autoEnabled }),
  });
  const data = await resp.json();
  if (!resp.ok) { showToast(data.error || "操作失败", true); return; }
  showToast(data.enabled ? "自动发送已开启" : "自动发送已关闭");
  loadUsers();
}

async function saveData() {
  const resp = await fetch("/api/save", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: "{}",
  });
  const data = await resp.json();
  if (!resp.ok) { showToast("保存失败", true); return; }
  showToast(`已保存 ${data.userCount} 个用户到 data.json`);
}

searchInput.addEventListener("input", render);
statusFilter.addEventListener("change", render);

let currentUserId = null;

function openModal(userId, phone, name) {
  currentUserId = userId;
  document.getElementById("smsTarget").textContent = `收件人：${name}（${phone}）`;
  document.getElementById("smsContent").value = DEFAULT_SMS;
  document.getElementById("smsModal").classList.add("show");
}

function closeModal() {
  document.getElementById("smsModal").classList.remove("show");
}

function showToast(msg, isError = false) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast" + (isError ? " error" : "");
  t.style.display = "block";
  setTimeout(() => t.style.display = "none", 2500);
}

async function confirmSend() {
  const content = document.getElementById("smsContent").value.trim();
  if (!content) { showToast("短信内容不能为空", true); return; }

  const resp = await fetch("/api/sms/send", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ userId: currentUserId, content }),
  });
  const data = await resp.json();
  if (!resp.ok) { showToast(data.error || "发送失败", true); return; }

  closeModal();
  showToast("短信已发送，等待对方回复");
  loadUsers();
}

document.getElementById("smsModal").addEventListener("click", e => {
  if (e.target.id === "smsModal") closeModal();
});

/* ========== 人工确认已故 ========== */
async function confirmDead(userId, name) {
  if (!confirm(`确认 ${name} 已经过世？\n（建议在电话核实或联系家属后再操作）`)) return;
  const resp = await fetch("/api/users/confirm-dead", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ userId }),
  });
  const data = await resp.json();
  if (!resp.ok) { showToast(data.error || "操作失败", true); return; }
  showToast(`${name} 已标记为已故`);
  loadUsers();
}

/* ========== 添加用户 ========== */
function openAddModal() {
  for (const id of ["f_name", "f_age", "f_phone", "f_idCard", "f_game", "f_account", "f_password"]) {
    document.getElementById(id).value = "";
  }
  document.getElementById("addModal").classList.add("show");
}

function closeAddModal() {
  document.getElementById("addModal").classList.remove("show");
}

document.getElementById("addModal").addEventListener("click", e => {
  if (e.target.id === "addModal") closeAddModal();
});

async function submitAddUser() {
  const body = {
    name: document.getElementById("f_name").value,
    gender: document.getElementById("f_gender").value,
    age: document.getElementById("f_age").value,
    phone: document.getElementById("f_phone").value,
    idCard: document.getElementById("f_idCard").value,
    game: document.getElementById("f_game").value,
    account: document.getElementById("f_account").value,
    password: document.getElementById("f_password").value,
  };
  const resp = await fetch("/api/users/add", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  const data = await resp.json();
  if (!resp.ok) { showToast(data.error || "添加失败", true); return; }
  closeAddModal();
  showToast("用户已添加");
  loadUsers();
}

loadUsers();
setInterval(loadUsers, 2000);

/* 倒计时每秒滴答一次（只更新数字，数据仍每2秒与服务器同步） */
setInterval(() => {
  document.querySelectorAll(".cd").forEach(el => {
    el.textContent = Math.max(0, Math.ceil((Number(el.dataset.deadline) - Date.now()) / 1000));
  });
}, 1000);
</script>
